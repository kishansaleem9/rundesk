name: CI

on:
  # NO `paths-ignore` HERE, and that is deliberate — it was tried and reverted.
  #
  # 5cf2474 added `paths-ignore: ['docs/**']` to skip runs for prose-only
  # commits. It cannot work on a `pull_request` trigger: GitHub evaluates path
  # filters for that event against the WHOLE PR DIFF (head vs base), not
  # against the commits in the latest push, and a run is skipped only when
  # EVERY changed file matches. This PR touches hundreds of files under
  # `apps/`, `packages/` and `test/`, so `docs/**` never matched and the very
  # next docs-only push spent a full run proving it.
  #
  # THE SAVING IS TAKEN AT THE JOB LEVEL INSTEAD — see the `changes` job. That
  # comment used to end here saying the fix "changes CI semantics for every
  # contributor" and that batching pushes was the answer for now. It was not:
  # three more docs-only pushes went out after it was written, at a full run
  # each. Documenting a leak is not closing one.
  pull_request:
  push:
    branches:
      - main
  # Re-run CI without inventing a commit to hang it off. A run that was
  # cancelled out of the queue, or a flake, should not need an empty commit in
  # the history to get another attempt.
  workflow_dispatch:

# One run per branch at a time.
#
# Pushing three times in ten minutes queued three full runs of everything, and
# the two older ones were building commits nobody was waiting on any more —
# then sat in the queue holding it up, and were eventually cancelled anyway. The
# newest commit is the one worth the runners.
#
# `main` is exempt: a run there is a record of whether that commit was good, and
# a later push must not erase the answer for an earlier one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Did this PUSH touch anything but prose?
  #
  # WHY A JOB RATHER THAN `paths-ignore`. Path filters on `pull_request` are
  # evaluated against the whole PR diff, which for this PR is hundreds of files,
  # so they never match. But the `synchronize` payload DOES carry `before` and
  # `after` for the push that triggered it — the incremental range, which is
  # exactly the question worth asking. So the diff is computed here and the two
  # expensive jobs are gated on the answer.
  #
  # IT FAILS OPEN, EVERY TIME. Anything unexpected — a force-push where `before`
  # is no longer an ancestor, a first push, a shallow fetch that lacks the
  # commit, an empty diff — runs the full suite. The cost of wrongly running is
  # thirty minutes; the cost of wrongly skipping is shipping untested code, and
  # those are not the same size of mistake.
  #
  # `Verify Monorepo` is deliberately NOT gated. It is about four minutes of the
  # thirty-three, and leaving it always-on means a docs push still reports a
  # real check rather than an empty set that a branch protection rule might
  # read as nothing having run.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.decide.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The head of the branch, with history, so `before` is reachable.
          # Without this the checkout is a merge commit and the diff below
          # cannot resolve either end of the range.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -u
          code=true
          if [ "$EVENT" = "pull_request" ] && [ "$ACTION" = "synchronize" ] \
             && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null \
             && git cat-file -e "${AFTER}^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BEFORE" "$AFTER")
            echo "files in this push:"
            echo "$changed" | sed 's/^/  /'
            # Skip only when there IS a diff and NOTHING in it lies outside
            # docs. An empty diff means something unexpected, so it runs.
            if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qvE '^(docs/|[^/]*\.md$)'; then
              code=false
            fi
          fi
          echo "run expensive jobs: $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify Monorepo
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.1

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: API tests
        run: pnpm --filter @rundesk/api test

      # Pure logic lifted out of components so it can be checked without a DOM
      # — e.g. which notification types Clear all is allowed to bin.
      - name: Web unit tests
        run: pnpm --filter @rundesk/web test

      - name: Migration sequence guardrail
        run: node scripts/check-migration-order.mjs

      # Step 6 of the re-audit applies deliberately-broken edits to the tree to
      # prove a check can fail. On a shared tree, a `git add -A` eventually
      # catches one — and one reached `43f7b57`, hiding the Add-fields button
      # behind a testid renamed `-DISABLED`. Nothing failed; the diff read as a
      # decision somebody had taken. Vigilance is not a control, so this is.
      - name: No break patches in the tree
        run: node scripts/check-no-break-patches.mjs

      # And that the guard above is looking at anything, because it was the
      # weakest zero in the set. Its roots were RELATIVE and reached through
      # `existsSync`, so from any directory but the repository root every root
      # missed, the walk visited nothing, and it printed "clean — no
      # break-patch signatures" and exited 0. Measured from /tmp: exactly that.
      # preflight.sh happens to `cd` first, which is why it survived.
      #
      # Now the roots are anchored to the script, a missing root fails instead
      # of being skipped, the file count is asserted against a floor, and
      # "clean" says how many files it read. 14 cases planting into a throwaway
      # tree — never into this one — and seven mutations, all of which bite.
      - name: And that guard actually looks at the tree
        run: node scripts/check-patch-guard.mjs --mutate

      # The re-audit ledger's headline count read `88 built · 21 partial · 64
      # missing` while the table under it — printed under the words "so the
      # number can be checked rather than believed" — read 104 / 20 / 49. BOTH
      # SUMMED TO 173, so the disagreement was invisible at a glance and
      # survived several passes. A count is the one thing in that file that
      # gets quoted without being checked, so it is checked here instead.
      - name: The re-audit ledger agrees with its own derivation
        run: node scripts/check-video2-counts.mjs

      # 573 break patches anchor on exact lines of source. A refactor that moves
      # one silently disarms the check it proves — and the only way to find out
      # used to be running that suite's set, eight minutes, to read one
      # `PATCH FAILED` line out of a long log. This dry-applies every patch in a
      # second and fails the build naming the ones that no longer find their
      # line, so the refactor and the disarmed check arrive in the same PR.
      #
      # `check-no-break-patches.mjs` above is the opposite guard: that none of
      # them is APPLIED in the tree. Both are needed — one says the patches can
      # still break the code, the other that they have not.
      - name: Every break patch still finds its line
        run: python3 scripts/check-break-patches.py

      # And still names a check that exists. A patch whose anchor is fine but
      # whose `# Reddens:` line points at a deleted check applies perfectly and
      # proves nothing — `teams-empty-state-1` named a check that had not
      # existed for a day. A RATCHET, now at ZERO on all three of its numbers:
      # the 121 claimless patches and the 36 rotted claims it was created to
      # grandfather are all closed, so it fails on the first one that arrives.
      - name: Break patches still name a check that exists
        run: node scripts/check-break-claims.mjs

      # And the denominator, which this audit had never printed. A suite with no
      # patch is not a suite that failed — it is one about which nothing is
      # known, and green says nothing either way. The first answer was 47 of
      # 101; then 0 of 101; then 11 of 113, because the count came from
      # grepping `chk(` and eleven suites name their helper `check(`. It reads
      # each suite's own EXPECTED_CHECKS now. Ratcheted, so a new suite arrives
      # with a patch.
      - name: No new suite arrives without a break patch
        run: node scripts/check-break-coverage.mjs

      # A conditional check makes the run LENGTH conditional, and every suite
      # compares its length with `!==`. So a real regression inside one of these
      # branches reports `✗ 88 of 92 checks ran` — a headline that reads as the
      # harness breaking rather than the product — with the failures it found
      # sitting underneath it. Four instances in two days, every one found by
      # running a patch. A heuristic and a ratchet, both said out loud in the
      # script: it finds the shape, not whether the condition is ever false.
      #
      # It also gates the assumption every number in this audit rests on: that
      # each suite declares EXPECTED_CHECKS and compares it with `!==`. That
      # line is what turns a run which stopped early into a reported failure
      # instead of a `0 failed` nobody questions, and nothing was checking it.
      # All 113 have it; a suite arriving without it, or reaching for `<`
      # because it expects a skip, fails the build that brings it.
      - name: No new suite gets a conditional check with no else
        run: node scripts/check-suite-check-branches.mjs

      # And that THAT rule can fail at all. It gates, its steady-state answer is
      # zero, and until check-branches-cases.mjs it had nothing able to tell a
      # working rule from a broken one — the position section-enders was in, and
      # the one three mutation harnesses turned out to be in even after they had
      # one. 13 cases over fixture suites, 6 of 6 mutations redden one.
      - name: The conditional-check rule can fail, and each case bites
        run: node scripts/check-branches-cases.mjs --mutate

      # And the module those suites were rewritten onto. It is load-bearing in
      # eleven of them, and within an hour of being written it had a hole of
      # exactly the shape it exists to prevent: `step` past the end of its
      # label list emitted a check with NO SENTENCE, which printed `PASS
      # undefined` and counted towards the total. Found by calling `step` three
      # times on a chain of two; invisible by reading.
      - name: The chain helper holds its contract
        run: node scripts/check-chain-helper.mjs --mutate

      # And the matcher that decides whether a claim counts as verified, for 798
      # patches across two checkers. Every one of its rules is a LOOSENING that
      # exists because a real claim was being misread, and a loosening is one
      # edit away from a matcher that matches anything. The floor's height is
      # pinned in both directions, because a test of the floor's existence left
      # lowering it from five words to four completely green.
      - name: The claim matcher holds its contract
        run: node scripts/check-claim-match.mjs --mutate

      # And the module that decides WHICH SUITE a patch is about. There were
      # four copies of that decision and they disagreed: one truncated
      # `sidebar-dms` to `sidebar` at the first hyphen, so 24 patches came out
      # attributed in one report and "(no suite named)" in another — and a patch
      # that cannot be attributed cannot be scheduled to run.
      - name: The patch-to-suite attribution holds its contract
        run: node scripts/check-suite-of-patch.mjs --mutate

      # And the module that decides WHICH TREE a recorded number is about. The
      # rule it replaced compared the suite file's commit date against the log's
      # mtime, and a suite fix committed while its own set was still running
      # passed that test while every patch in the run had already been measured
      # against the unfixed file. Two greens went unmeasured for a day behind a
      # row that called their logs current.
      # `--mutate` earned itself on the first run. One case claimed to prove the
      # "newest log wins" comparison and was written backwards from its own
      # comment: it named the OLDER file to sort first, so a module that simply
      # overwrote every time still ended on the newer and answered correctly.
      # Replacing the comparison with `if (true)` left all 36 cases green. The
      # names are reversed now, and 8 of 8 mutations redden a case.
      - name: The break-log provenance reader holds its contract, and each case bites
        run: node scripts/check-log-tree.mjs --mutate

      # And a press on a control the check above it is allowed to find absent.
      # `imports-3-deadpreset` leaves Start disabled and its run reported 7 of
      # 19 checks: twelve checks about what the import wrote, silenced by one
      # unbounded click, under a row crediting the patch with the reddening it
      # claims. Nineteen sites had this shape and all nineteen were real — a
      # bare standalone press has no short-circuit to hide behind, which is why
      # this one is mechanical where the same rule over reads is not.
      #
      # Rule ten is the first that reads code running in the BROWSER. A
      # Playwright locator auto-waits; `document.querySelector` does not, and
      # answers null on no match, so a bare dereference races the render. Under
      # `sidebar-reorder-4-gap-uses-stale-parent` that printed `Cannot read
      # properties of null (reading 'dispatchEvent')` — true, and it names
      # neither the element nor the drag. The first scan for it reported eleven
      # sites of which SIX were already guarded, in five spellings a text rule
      # cannot see, so the rule classifies the variable's first USE instead;
      # each of those six spellings is now a case.
      - name: Nothing ends a section on a throw where a check belongs
        run: node scripts/check-suite-section-enders.mjs

      # Rule six of that checker, which is a gate over a tree with zero sites
      # left in it — and zero is the number this audit has learnt not to take on
      # trust. The rule turns on two things that can be wrong without looking
      # wrong: which `chk` argument is the message, and a comma splitter that
      # has to see through nested calls and strings to say so. Each case here is
      # written so that deleting the line it covers changes the answer; all six
      # mutations redden, each on the case that names the defect.
      - name: Rule six's reader holds its contract
        run: node scripts/check-suite-reads.mjs --mutate

      # And the five rules ABOVE it, which had no case file at all — five loops
      # reporting 0 forever with nothing able to tell a working rule from a
      # broken one. Not refactored into functions, because that is the change
      # that turns a real 0 into a false one while looking like tidying: the
      # checker takes a SUITE_DIR and this points it at fixture suites, one
      # shape per file, then asserts on what it actually prints. `--mutate`
      # applies nineteen mutations of the checker and requires each to redden a
      # case; all nineteen bite. Its first case found that one physical site was
      # being reported twice under two labels, and a later one found that every
      # mutant had been dying on an unresolvable import before running a line —
      # so the pass had been reporting twelve of twelve while proving nothing.
      # A mutant now has to walk a fixture and print a summary before its
      # verdict is read.
      - name: Every ender rule holds its cases, and each case bites
        run: node scripts/check-suite-enders.mjs --mutate

      # The ledger recorded the cover picker's Upload tab as UNMEASURABLE
      # because presign → PUT → commit "cannot run without credentials this
      # repository does not hold". That reason was wrong: `R2Service` already
      # reads `R2_ENDPOINT` and already sets `forcePathStyle: true`, so a local
      # S3-compatible server finishes the path with no product change at all.
      # `scripts/e2e-lanes/s3-stub.mjs` is that server, and this drives THE
      # PRODUCT'S OWN CLIENT against it — real SDK, real SigV4, nothing mocked
      # — because a test double that quietly stops being faithful turns every
      # suite built on it green while measuring nothing. 14 cases, 8 of 8
      # mutations of the stub redden one.
      # A write that lands in the WRONG workspace succeeds — no error, no failing
      # check, no log line. `POST /workspaces/:id/docs/import` shipped carrying
      # only JwtAuthGuard and a feature flag, which prove who you are and that
      # the feature is on, not that you belong to the workspace in the path. It
      # was green in 29 tests while writing into somebody else's workspace,
      # because every one of them was about the content. Found by reading the
      # sibling route. 59 write routes name a :workspaceId; the 14 protected in
      # their SERVICE instead are listed by name, each read before it went in.
      - name: Every workspace write proves the caller belongs there
        run: node scripts/check-workspace-guards.mjs

      # A suite that is not registered is verified once on a lane and never
      # again. `doc-import` was in that state while the resume doc said every
      # suite was registered, and nothing compared the directory with this
      # file. Reads `run:` lines only — a suite named in a comment, a step name
      # or behind a shell `#` is run by nothing — and fails on an empty read.
      - name: Every e2e suite has a CI step
        run: node scripts/check-suites-registered.mjs

      - name: And that gate can fail, and each case bites
        run: node scripts/check-suites-registered-cases.mjs --mutate

      - name: The S3 stub is faithful to the SDK, and each case bites
        run: node scripts/check-s3-stub.mjs --mutate

      # A lane's old API really stops before a new one starts. Two lane scripts
      # did not wait for it and one never stopped it at all, so a lane could be
      # reported UP on the build it was meant to replace.
      - name: A lane's old API stops before its port is reused
        run: bash scripts/check-lane-api-down.sh --mutate

      # A break planner that crashed wrote an empty plan, and both chain
      # scripts read the empty plan as "nothing left" and exited 0.
      - name: A failed break planner is never read as nothing left
        run: bash scripts/check-build-plan.sh --mutate

      # One round loop for both chain scripts. The second copy had lost the
      # guard for "somebody else has the lanes" and stopped on no progress.
      - name: The break round loop ends the way it says
        run: bash scripts/check-rounds.sh --mutate

      # Lane locks carry their holder's PID. A holder reaped by SIGKILL left a
      # bare directory, and every waiter then waited for ever in silence.
      - name: A dead holder's lane lock is taken, a live one kept
        run: bash scripts/check-locks.sh --mutate

      # A suite's break results are one file per suite. Two of its sets on two
      # lanes truncated each other's; the dispatcher now passes a busy suite by.
      - name: One suite's break sets never run at once
        run: bash scripts/check-run-plan.sh --mutate

      # A patch that only a model can redden ran on lanes with none, and read
      # as a patch that reddened nothing. Its set now runs with a model.
      - name: A break set that needs a model runs with one
        run: bash scripts/check-model-lanes.sh --mutate

      # `fleet-up.sh` read a bare number as a count and drops every lane it is
      # given: healing lane 3 alone would have dropped lanes 1 and 2.
      - name: A lane number is one lane, never a count
        run: bash scripts/check-lane-lists.sh --mutate

      # A migration that creates a table proves a lane current as well as one
      # that adds a column; the restart looked for columns only.
      - name: A new table proves a lane current too
        run: bash scripts/check-schema-witness.sh --mutate

      # Every checker stops through bail(). It returned whenever output was
      # still queued — i.e. whenever piped, as here — and the checker ran on.
      - name: bail stops the checker and loses no output
        run: node scripts/check-bail.mjs --mutate

      # The same recorded reason, one subsystem over. A row of AI surfaces is
      # blocked in the ledger on ANTHROPIC_API_KEY being "empty here and in
      # CI", and their suites assert the refusal. But `ai.service.ts` writes
      # `new Anthropic({ apiKey })` with no baseURL, and the SDK's own default
      # for that is readEnv('ANTHROPIC_BASE_URL') — so the seam is already in
      # the product and needs no change to it. The first case asserts exactly
      # that, against the real SDK rather than by reading its source: an SDK
      # that stopped honouring the variable would otherwise send these suites
      # at the live API. 10 cases, 6 of 6 mutations redden one.
      - name: The model seam is really a seam, and each case bites
        run: node scripts/check-model-stub.mjs --mutate

      # And the other direction from the ledger's own reconciliations: does a
      # line of the SPECIFICATION appear anywhere in the evidence? 115
      # timestamped frame observations, and asking found `03:15` — a cover
      # picker tab checked for existing with nothing inside it ever touched.
      - name: Every frame observation is answered somewhere
        run: node scripts/check-frame-traceability.mjs

      # Two generations of hashed chunks must survive a publish, or a tab open
      # across a deploy 404s on every lazy import.
      - name: Web publish keeps the previous release's chunks
        run: bash test/deploy/publish-web-dist.test.sh

      # A timed-out locator in one section of the deployed-UI check used to end
      # the whole run while the summary still read like a near-complete pass.
      # Needs no browser: it drives verify-ui.mjs against a stub.
      - name: Deployed-UI check survives a section that throws
        run: bash test/deploy/verify-ui-isolation.test.sh

  # The checks that need a real database.
  #
  # Every defect these have caught was invisible to the unit suites by
  # construction: a drizzle query that renders differently than it reads, a
  # conditional write whose condition only exists in SQL, a constraint the
  # fresh-install path never created. A fake database cannot fail any of them —
  # it is the thing deciding the answer.
  #
  # The schema is built by `drizzle-kit push` from the TypeScript source, which
  # is exactly how a new deployment is built, so a constraint that lives only in
  # a migration is missing here too rather than silently present.
  postgres-harnesses:
    name: Postgres harnesses
    runs-on: ubuntu-latest
    # The long job. Skipped when the push was prose only.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # THIS NUMBER GOES STALE EVERY TIME A SUITE IS ADDED, AND IT HAS TWICE.
    #
    # First it said "it now runs twenty-one" at 32 minutes, measured off the run
    # at 2cd5d0a: seventeen suites in 18m30s, so roughly 1.1 minutes each — by
    # then the job ran FIFTY, about 55 minutes, and 32 was not a backstop any
    # more but a guaranteed failure a few suites from the end, after paying for
    # all of it. It was raised to 75 for those fifty.
    #
    # The job now runs ONE HUNDRED AND EIGHTY-SIX — every suite in the repo but the
    # six in `browser-suites`, which `check-suites-registered.mjs` now enforces
    # rather than this comment asserting it. At the measured 1.1 minutes each
    # that is about 205 minutes plus setup. The count has gone
    # 50 → 85 → 88 → 93 → 96 → 98 → 101 → 104 → 107 → 110 → 111 → 112 → 113 → 114 → 115 → 116 → 117 → 119 → 120 → 121 → 122 → 123 → 124 → 126 → 127 → 128 → 129 → 130 → 131 → 132 → 133 → 134 → 135 → 136 → 137 → 138 → 139 → 141 → 142 → 144 → 146 → 147 → 148 → 149 → 150 → 153 → 155 → 156 → 158 → 159 → 160 → 161 → 162 → 163 → 164 → 165 → 166 → 167 → 168 → 169 → 170 → 171 → 172 → 173 → 174 → 175 → 176 → 177 → 178 → 179 → 180 → 181 → 182 → 183 → 184 → 185 → 186.
    #
    # The limit is 210, raised from 180 when the job reached 153 suites: about
    # 168 minutes plus setup against 180 left a margin under five percent. That
    # is a stopgap, not the fix.
    # Raising it costs nothing — GitHub bills the runtime, not the limit, and
    # the limit only decides whether a slow run finishes or is killed with the
    # answer half-written. At 118 estimated against 150 the margin was about
    # twenty percent, which is thinner than the variance between a warm runner
    # and a cold one.
    #
    # **THE FIX IS TO SPLIT THIS JOB**, and it is deliberately not being done
    # here. Splitting means duplicating the Postgres + Meilisearch + build
    # setup into a second job and dividing 107 steps between them, and CI
    # cannot run until October, so it could not be validated — a restructure
    # that is wrong is worse on the first green day than a job that is merely
    # long. Whoever has a working pipeline should do it, and will be able to
    # see it work.
    #
    # Splitting shortens the WALL CLOCK and not the bill: the minutes are the
    # same either way, plus one more setup.
    #
    # IF YOU ADD A SUITE, RE-DO THIS ARITHMETIC. `grep -c "^ *run: node test/e2e/"`
    # over this job gives the count — unanchored, it also counts this comment —
    # then multiply by 1.1 and add a few minutes of setup.
    # A limit that is merely old reads as a flaky pipeline, and a flaky pipeline
    # is one nobody looks at.
    #
    # A generous limit costs nothing when the job finishes sooner: GitHub bills
    # the runtime, not the limit. The limit only decides whether a slow run is
    # allowed to finish or is killed with the answer half-written.
    timeout-minutes: 210

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rundesk
          POSTGRES_PASSWORD: rundesk
          POSTGRES_DB: rundesk_calls
        ports:
          - 5432:5432
        # `-U rundesk` is not a detail. Bare `pg_isready` connects as the
        # container's OS user, which is root, and root is not a Postgres role —
        # so every five seconds for the whole twenty-odd minutes this job runs,
        # the service container logs `FATAL: role "root" does not exist`. The
        # healthcheck still passes (the server answered, which is all it asks),
        # so nothing looked wrong; what it cost was the LOG. Roughly 280 lines
        # of that noise are appended after the test output, and the API only
        # serves log tails — so a failing suite's own message sat behind more
        # noise than could be paged back through, and a real failure could not
        # be diagnosed without spending another run.
        options: >-
          --health-cmd "pg_isready -U rundesk -d rundesk_calls"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # THE ONE DATABASE this job has — the service above creates only this
      # one — and every suite reads it, because it is the one the API writes.
      # Twenty-five steps used to override it with `rundesk_ci`, a database
      # nothing creates, so each of those suites would have failed to connect
      # on the first day CI ran again. Do not override it per step.
      DATABASE_URL: postgres://rundesk:rundesk@localhost:5432/rundesk_calls
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      # Where the object store listens. Suites reach the stub's control routes
      # through `test/e2e/lib/store.mjs`, which reads this; unset, it falls back
      # to the lane formula (9100 + api - 3020), which is 9091 for this job.
      E2E_STORE_PORT: 9100

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.1

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create the schema from the TypeScript source
        run: pnpm --filter @rundesk/db exec drizzle-kit push --force

      - name: Load the fixtures
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/test/calls-http-fixtures.sql

      # The harnesses import the compiled service, guards and controllers, so
      # what runs here is what ships rather than a re-compilation of it.
      - name: Build the API
        run: pnpm --filter @rundesk/api build

      # §2.8 SyncUp: the call routes, the consent condition that rides with the
      # transcript write, the one-live-call index, and the record a call leaves.
      - name: Calls, against real Postgres
        working-directory: apps/api
        run: npx tsx test/calls-http.mts

      # §2.2/§2.8 gap 11: "Contact your admin" — who was actually reached, and
      # the once-a-day rule that has been silently wrong in both directions.
      - name: The feature gate, against real Postgres
        if: '!cancelled()'
        working-directory: apps/api
        run: npx tsx test/feature-gate-http.mts

      # §2.8 — the call itself, between two real browsers.
      #
      # Everything above stops at the API. The peer-to-peer path had never been
      # executed by anything until this suite, and the first thing it found was
      # a deadlock that left roughly two calls in five connecting forever, with
      # both ends reporting themselves healthy. Nothing cheaper than two
      # browsers can see that.
      - name: Install Chromium
        if: '!cancelled()'
        run: pnpm exec playwright install --with-deps chromium

      - name: Seed a workspace
        if: '!cancelled()'
        run: pnpm --filter @rundesk/db exec tsx src/seed.ts

      - name: Build the SPA
        if: '!cancelled()'
        run: pnpm --filter @rundesk/web exec vite build

      # THE OBJECT STORE EVERY LANE HAS. Each suite below is verified on a lane
      # whose API points at `scripts/e2e-lanes/s3-stub.mjs` — `lane-env.sh`
      # gives every launcher the same four variables — so a job with no store
      # runs them in a configuration none of them was checked in: uploads fail
      # on "Storage is not configured", and the signing checks in `task-cover`,
      # `attach-on-create` and `task-boundaries` have nothing to sign. Same stub,
      # same `--strict` (an unsigned PUT is refused), readiness read from the
      # line it prints rather than slept through.
      - name: Start the object store
        if: '!cancelled()'
        run: |
          RUNDESK_S3_STUB=1 nohup node scripts/e2e-lanes/s3-stub.mjs \
            --port "$E2E_STORE_PORT" --bucket rundesk-ci --strict > /tmp/s3.log 2>&1 &
          disown
          for i in $(seq 1 50); do
            if grep -q '"ready":true' /tmp/s3.log; then echo "store up"; exit 0; fi
            sleep 0.2
          done
          echo "The object store never announced itself. Its output:"; cat /tmp/s3.log; exit 1

      # Backgrounded and waited for: a suite that starts talking to an API that
      # is not up yet fails for a reason that has nothing to do with calls.
      - name: Start the API
        if: '!cancelled()'
        # From apps/api, like every other step here: tsx is a dependency of that
        # package, so `npx tsx` from the repo root is "tsx: not found" — which
        # presents as an API that never comes up rather than as a missing tool.
        working-directory: apps/api
        run: |
          # nohup + disown so it outlives this step's shell — the runner tears
          # processes down at the end of the JOB, not the end of a step.
          nohup npx tsx dist/apps/api/src/main.js > /tmp/api.log 2>&1 &
          disown
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null "http://127.0.0.1:$PORT/api/v1/auth/oauth/providers"; then
              echo "API up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "API never came up. Its output:"; cat /tmp/api.log; exit 1
        env:
          PORT: 3011
          # The store started above — the same four variables `lane_store_env`
          # exports. Not credentials: the stub checks no signature.
          R2_ENDPOINT: http://127.0.0.1:${{ env.E2E_STORE_PORT }}
          R2_ACCESS_KEY_ID: stub-key
          R2_SECRET_ACCESS_KEY: stub-secret
          R2_BUCKET_NAME: rundesk-ci

      - name: A real SyncUp, in two browsers
        if: '!cancelled()'
        run: node test/e2e/syncup-live.mjs --api 3011 --dist apps/web/dist

      # The suites written for the video1 gap work. They live here rather than
      # in browser-suites because each one drives the real API against real
      # Postgres — a stubbed run would decide its own answers, and every one of
      # these gaps was a case where the parts existed and nothing joined them
      # up, which is exactly what a stub cannot see.
      #
      # `!cancelled()` on each, so one failure reports its own name instead of
      # hiding the four behind it.
      - name: Chat message actions
        if: '!cancelled()'
        run: node test/e2e/chat-message-actions.mjs --api 3011 --dist apps/web/dist

      - name: Task creation depth
        if: '!cancelled()'
        run: node test/e2e/task-depth.mjs --api 3011 --dist apps/web/dist

      - name: The second-level panel collapses
        if: '!cancelled()'
        run: node test/e2e/panel-collapse.mjs --api 3011 --dist apps/web/dist

      - name: Status, timed mute, contrast, booking a call
        if: '!cancelled()'
        run: node test/e2e/settings-depth.mjs --api 3011 --dist apps/web/dist

      - name: The person profile panel
        if: '!cancelled()'
        run: node test/e2e/person-panel.mjs --api 3011 --dist apps/web/dist

      # Every addressability fix driven in one session against a real API, a
      # real Postgres and a real Meilisearch — the thing the per-fix suites
      # cannot catch is one of them breaking another.
      - name: Addressability, end to end
        if: '!cancelled()'
        run: node test/e2e/addressability-live.mjs --api 3011 --dist apps/web/dist

      # The four suites that used to be unrunnable anywhere but one laptop.
      #
      # Each hardcoded some combination of a dev server on :5173, one
      # workspace's UUID, and a colleague called "Colleague" — so pointed at a
      # freshly seeded database they swept an empty shell and failed for
      # reasons that had nothing to do with the UI. They now serve the built
      # dist themselves, discover a workspace, and create the little they need
      # (tasks across statuses and priorities, a DM, a shared task and
      # meeting) before reading it back.
      #
      # Being out of CI is why three of them had gone stale against shipped
      # decisions: two asserted an Inbox "Other" chip §2.2 removed, one wanted
      # "Mark all read" where §2.5 put "Clear all", and one looked for the
      # language switcher in the top bar §1.5 cleared.
      #
      # E2E_EMAIL is set because their defaults name the production verify
      # user, which no seeded database has. admin + org-admin are both seeded,
      # and the pair matters: some checks need somebody else to act on you.
      - name: UI sweep — every surface, in a browser
        if: '!cancelled()'
        run: node test/e2e/ui-sweep.mjs --api 3011 --dist apps/web/dist

      - name: The video1 regression sweep
        if: '!cancelled()'
        run: node test/e2e/video-regression.mjs --api 3011 --dist apps/web/dist
        env:
          E2E_EMAIL: admin@rundesk.internal
          E2E_PASSWORD: Admin@123!

      # §G10 — asking for access to something you cannot see. Creates its own
      # plain member, because every seeded account is a workspace_admin and a
      # manager can see private items by design: run as one of those and the
      # 403 under test never happens.
      - name: Requesting access to a private object
        if: '!cancelled()'
        run: node test/e2e/request-access.mjs --api 3011 --dist apps/web/dist
        env:
          E2E_EMAIL: admin@rundesk.internal
          E2E_PASSWORD: Admin@123!

      # §G15-10 — a List that lives directly in a Space. Makes its own space:
      # reusing an existing one means the hidden container is already there
      # from an earlier run, so the creation path — the thing under test —
      # never runs, and a broken container passes cleanly.
      - name: A List under a Space
        if: '!cancelled()'
        run: node test/e2e/list-under-space.mjs --api 3011 --dist apps/web/dist
        env:
          E2E_EMAIL: admin@rundesk.internal
          E2E_PASSWORD: Admin@123!

      # §G12-2 — answering a thread from the Replies list without opening the
      # channel. Needs two accounts: a notification only reaches somebody who
      # did not write the message.
      - name: Replies answers a thread in place
        if: '!cancelled()'
        run: node test/e2e/replies-inline-thread.mjs --api 3011 --dist apps/web/dist
        env:
          E2E_EMAIL: admin@rundesk.internal
          E2E_PASSWORD: Admin@123!
          E2E_PEER_EMAIL: org-admin@rundesk.internal
          E2E_PEER_PASSWORD: OrgAdmin@123!

      # §G10-6 / §G10-7 — two fan-outs that told nobody. API-level: these are
      # rows arriving in somebody else's inbox, not pixels, and driving a
      # browser to observe them would test the inbox rather than the fan-out.
      - name: Notifications that were never sent
        if: '!cancelled()'
        run: node test/e2e/notification-gaps.mjs --api 3011
        env:
          E2E_EMAIL: admin@rundesk.internal
          E2E_PASSWORD: Admin@123!
          E2E_PEER_EMAIL: org-admin@rundesk.internal
          E2E_PEER_PASSWORD: OrgAdmin@123!

      # §G14-8 — a minimised call survives navigating away. Needs fake capture
      # devices, and needs the navigation to be a CLICK: a full page load tears
      # down the app and cannot carry a MediaStream, so it would fail forever
      # and say nothing about the defect.
      - name: A SyncUp survives leaving the page
        if: '!cancelled()'
        run: node test/e2e/call-survives-navigation.mjs --api 3011 --dist apps/web/dist
        env:
          E2E_EMAIL: admin@rundesk.internal
          E2E_PASSWORD: Admin@123!

      # §G01-9 — the Overview's Bookmarks card. Needs two accounts: what the
      # owner-scoping protects against is a colleague who knows an id, not an
      # anonymous caller, and only a second signed-in user can show that.
      - name: Bookmarks, internal and external
        if: '!cancelled()'
        run: node test/e2e/bookmarks.mjs --api 3011 --dist apps/web/dist
        env:
          E2E_EMAIL: admin@rundesk.internal
          E2E_PASSWORD: Admin@123!
          E2E_PEER_EMAIL: org-admin@rundesk.internal
          E2E_PEER_PASSWORD: OrgAdmin@123!

      # §G03-6 — Trending In Workspace / Trending For You. Two accounts again:
      # the two modes are only distinguishable when somebody else opens things.
      - name: Trending sorts
        if: '!cancelled()'
        run: node test/e2e/trending-sort.mjs --api 3011
        env:
          E2E_EMAIL: admin@rundesk.internal
          E2E_PASSWORD: Admin@123!
          E2E_PEER_EMAIL: org-admin@rundesk.internal
          E2E_PEER_PASSWORD: OrgAdmin@123!

      # An id that cannot be a UUID must be refused on the way in rather than by
      # Postgres. Both halves of that were live, and neither failed a check —
      # the only symptom was `invalid input syntax for type uuid` in this job's
      # own service-container log, which nothing was reading.
      - name: Malformed ids
        if: '!cancelled()'
        run: node test/e2e/malformed-ids.mjs --api 3011
        env:
          E2E_EMAIL: admin@rundesk.internal
          E2E_PASSWORD: Admin@123!

      # §V2-04 — a form submission becomes a task that says a form made it.
      # The meeting half of the same change cannot run here (it needs a model),
      # so it is covered by a unit test with the AI stubbed instead.
      # §V2-01b `[00:24]`, frame `00:25` — "Progress (Auto)", the one custom
      # field she demonstrates end to end.
      #
      # The value is DERIVED, so the checks that earn their minutes are the ones
      # about not lying: that nothing is stored for it, that writing it is
      # refused, that an ordinary comment is not counted as work, and that a
      # task with nothing to count reports null rather than a confident 0%.
      #
      # It stages its own space, project and list — custom fields are defined
      # per project, so a field on the seeded project would change the shape of
      # every other suite's task rows.
      - name: Progress (Auto) custom field
        if: '!cancelled()'
        run: node test/e2e/custom-field-progress.mjs --api 3011 --dist apps/web/dist
        env:
          E2E_EMAIL: admin@rundesk.internal
          E2E_PASSWORD: Admin@123!

      # §V2-13, frame `09:10` — "List moved to trash" + Undo (Ctrl+Z).
      #
      # Deleting from the tree used to succeed in SILENCE, with the only way
      # back being knowledge that Trash is a settings tab. The checks that earn
      # the minutes are the two that cannot be faked: that the delete is SOFT
      # (an undo over a hard delete would be a button that apologises), and
      # that pressing Undo puts the list back according to the API rather than
      # the screen. A suite asserting "a toast appeared" would pass against a
      # button wired to nothing.
      - name: Undo a delete
        if: '!cancelled()'
        run: node test/e2e/undo-delete.mjs --api 3011 --dist apps/web/dist
        env:
          E2E_EMAIL: admin@rundesk.internal
          E2E_PASSWORD: Admin@123!

      - name: Task provenance
        if: '!cancelled()'
        run: node test/e2e/task-provenance.mjs --api 3011
        env:
          E2E_EMAIL: admin@rundesk.internal
          E2E_PASSWORD: Admin@123!

      # §V2-09 — the task cover. The load-bearing check is that a LINKED image
      # comes back byte for byte: task attachments store a hyperlink in
      # `storage_key` and read it back through R2, and this is the shape that
      # does not repeat it.
      - name: Task cover
        if: '!cancelled()'
        run: node test/e2e/task-cover.mjs --api 3011 --dist apps/web/dist
        env:
          E2E_EMAIL: admin@rundesk.internal
          E2E_PASSWORD: Admin@123!

      # §V2-08 — merging one task into another. She never narrates it, so it
      # ranked last in the item; it is also the only one whose failure mode is
      # silent data loss, so the suite loads a task with one of everything and
      # counts each kind on the survivor afterwards. Both tasks are given the
      # SAME assignee and watcher first, because duplicates being merged
      # normally share them and every join table is unique on (task, thing) —
      # a bulk UPDATE throws on the first collision.
      - name: Merging one task into another
        if: '!cancelled()'
        run: node test/e2e/task-merge.mjs --api 3011 --dist apps/web/dist
        env:
          E2E_EMAIL: admin@rundesk.internal
          E2E_PASSWORD: Admin@123!

      # §V2-12, frame `20:55` — the Teams destination.
      #
      # It is driven as a REGISTERED PLAIN MEMBER, and that is the whole point:
      # All People, All Teams and the reporting tree already existed inside
      # workspace settings, whose route redirects any non-admin back to /app, so
      # looking at your own organisation required admin rights. Run as the
      # seeded admin every check here would pass against the old code too.
      #
      # It also fails if an Analytics tab appears. The frame lists one, nothing
      # exists behind it, and she never opens it — so it would be a page whose
      # purpose somebody has to guess.
      - name: The Teams destination
        if: '!cancelled()'
        run: node test/e2e/teams-destination.mjs --api 3011 --dist apps/web/dist
        env:
          E2E_EMAIL: admin@rundesk.internal
          E2E_PASSWORD: Admin@123!

      # §V2-11 `[18:51]` — what the AI was WORTH, not only what it cost.
      #
      # Two checks earn the minutes. The panel must be able to report a LOSS:
      # the suite stages real spend against a zero benchmark, so a `Math.max(0,
      # …)` anywhere in the arithmetic — one line, breaking nothing else — is
      # caught rather than shipped, because that single change turns an
      # analytics page into marketing. And the benchmark must MOVE the figures:
      # a settings form that saves, reads back and changes nothing on the page
      # it belongs to is this codebase's most common defect.
      - name: AI value and activity
        if: '!cancelled()'
        run: node test/e2e/ai-value.mjs --api 3011 --dist apps/web/dist
        env:
          E2E_EMAIL: admin@rundesk.internal
          E2E_PASSWORD: Admin@123!

      # §V2-08 — the two items of frame `15:32` she actually narrates.
      #
      # `[15:27]` description history. The check worth the minutes is that a
      # revision stores the text that was REPLACED rather than the text that
      # replaced it: `doc_revisions` does the opposite, so this is exactly the
      # thing a later refactor "corrects" into consistency, and with the other
      # design the description every existing task has right now would be
      # destroyed by its own first edit.
      #
      # `[15:32]` print. It does not assert that `window.print()` was called —
      # a stylesheet that hid everything would pass that. It reads the document
      # that was built for the printer and asserts the description, the title
      # and the id are on it.
      - name: Task menu — description history and print
        if: '!cancelled()'
        run: node test/e2e/task-menu.mjs --api 3011 --dist apps/web/dist
        env:
          E2E_EMAIL: admin@rundesk.internal
          E2E_PASSWORD: Admin@123!

      # §V2-05 — recording into a comment, and the @ picker's access warning.
      # Two things here are worth the minutes. The first is the Urdu check: she
      # flagged `[04:26]` that ClickUp transcribes Urdu into Devanagari, and
      # this sets the ACCOUNT to Urdu and reads back the language the recognizer
      # was actually started in, so the one way to reintroduce her defect —
      # transcribing by some route that skips `localeToSpeechLang` — fails here.
      # The second is that the "Does not have access to task" flag is compared
      # against what the GUARD does when that person really opens the task, so a
      # warning that disagrees with reality is a failure rather than a feature.
      - name: Comment recording and mention access
        if: '!cancelled()'
        run: node test/e2e/comment-recording.mjs --api 3011 --dist apps/web/dist
        env:
          E2E_EMAIL: admin@rundesk.internal
          E2E_PASSWORD: Admin@123!

      # §V2-10 — a task<->doc link read from the DOC end, which nothing ever
      # queried. The load-bearing check is the visibility one: a doc listing its
      # tasks must not become a way to read the titles of private ones.
      - name: Doc and task links
        if: '!cancelled()'
        run: node test/e2e/doc-task-links.mjs --api 3011 --dist apps/web/dist
        env:
          E2E_EMAIL: admin@rundesk.internal
          E2E_PASSWORD: Admin@123!

      # §V2-07 — exporting the list you are looking at. The load-bearing check
      # is the injection one: a task titled `=cmd|...` must not reach a
      # spreadsheet as a formula.
      - name: List export
        if: '!cancelled()'
        run: node test/e2e/list-export.mjs --api 3011
        env:
          E2E_EMAIL: admin@rundesk.internal
          E2E_PASSWORD: Admin@123!

      # §V2-07 — Private view / Protect view / Pin / default / Copy link /
      # Sharing. The load-bearing checks are the negative ones: a second, plain
      # member must not see somebody's private view, and must not be able to
      # change a protected one. Before this, ANY member could delete ANY view.
      - name: View visibility
        if: '!cancelled()'
        run: node test/e2e/view-visibility.mjs --api 3011
        env:
          E2E_EMAIL: admin@rundesk.internal
          E2E_PASSWORD: Admin@123!

      # §V2-07 — "Saved filters", frame 11:41. The rules themselves are
      # evaluated in the browser and tested in apps/web/src/lib/task-filters.
      # test.ts; this covers the half that crosses the wire — per-person
      # scoping, save-by-name replacing, and refusing a nest the panel could
      # not have built.
      - name: List filters
        if: '!cancelled()'
        run: node test/e2e/list-filters.mjs --api 3011
        env:
          E2E_EMAIL: admin@rundesk.internal
          E2E_PASSWORD: Admin@123!

      # §V2-06 — "Create a Space" collects more than a name, and the workflow
      # preset does something. The load-bearing check is the last one: the
      # preset SEEDS THE SPACE'S FIRST LISTS (`[07:46]`), without which the
      # wizard collects a purpose and throws it away.
      - name: Space presets
        if: '!cancelled()'
        run: node test/e2e/space-presets.mjs --api 3011
        env:
          E2E_EMAIL: admin@rundesk.internal
          E2E_PASSWORD: Admin@123!

      # §V2-02 — the Planner's time blocks. `grep -ri time.block` returned zero
      # files before this. The two load-bearing checks are not about the
      # feature: a block is PERSONAL, so a second member must not read or
      # delete one; and its label is RESOLVED from the task, so renaming the
      # task renames every block pointing at it.
      - name: Planner blocks
        if: '!cancelled()'
        run: node test/e2e/planner-blocks.mjs --api 3011
        env:
          E2E_EMAIL: admin@rundesk.internal
          E2E_PASSWORD: Admin@123!

      # §V2-06 — the wizard itself. `space-presets.mjs` proves the API applies
      # what it is sent; this proves a person can send it, which was the gap.
      # The load-bearing checks are the last four: what the wizard POSTs is
      # what was chosen, not just the name.
      - name: Space wizard
        if: '!cancelled()'
        run: node test/e2e/space-wizard.mjs --dist apps/web/dist

      # §V2-06 — the suite that decides whether the ClickApps grid is a feature
      # or a picture of one. Renders the same list under a space with every
      # switch on and a space with them off, and checks the second is genuinely
      # missing what the first shows. The first three checks are the other half
      # of the contract: `features: null` — every space made before the column
      # existed — must read as ALL ON.
      # §V2-13, frames `07:10` / `07:40` / `09:25` — Team View.
      #
      # The frames show Team three times, and it was not a view type at all.
      # NOT paywalled here, deliberately: ClickUp gates it because it is a paid
      # tier there, and imitating the gate would mean offering to unlock
      # something Rundesk does not have.
      #
      # The checks are on the ARITHMETIC each row reports, not on the rows
      # existing. A view that grouped by person but counted the whole list
      # renders identically — the fixture gives two people different loads, one
      # task with two assignees and one with none, so the numbers separate them.
      - name: Team view
        if: '!cancelled()'
        run: node test/e2e/team-view.mjs --api 3011 --dist apps/web/dist
        env:
          E2E_EMAIL: admin@rundesk.internal
          E2E_PASSWORD: Admin@123!

      # §V2-S03, frames `02:15`–`02:55` — checklists.
      #
      # The API supported many checklists per task from the start; the UI could
      # never make a second one, and when a template produced one the single
      # add-item form at the bottom of the panel still wrote into
      # `checklists[0]` whichever list you were looking at. The discriminating
      # check is phrased by DESTINATION — "an item was added" passes on the
      # broken build too, because the item existed, just in the wrong list.
      - name: Checklists
        if: '!cancelled()'
        run: node test/e2e/checklists.mjs --api 3011 --dist apps/web/dist
        env:
          E2E_EMAIL: admin@rundesk.internal
          E2E_PASSWORD: Admin@123!

      # §V2-S02, frame `01:20` — "Collapse empty fields".
      #
      # A toggle that hides things is easy to build wrongly: it hides fields
      # that have values, it hides silently (a collapsed field and a missing
      # one look identical), or it forgets on reload. One check each, plus the
      # exemption the frame does not show and the product needs — an empty
      # REQUIRED field is the one blank somebody has to see.
      - name: Collapse empty fields
        if: '!cancelled()'
        run: node test/e2e/collapse-empty-fields.mjs --api 3011 --dist apps/web/dist
        env:
          E2E_EMAIL: admin@rundesk.internal
          E2E_PASSWORD: Admin@123!

      # §V2-S14, frame `13:05` — the planner rail's five sections.
      #
      # AGAINST THE REAL API on purpose. The planner asked for its assigned
      # tasks at `/tasks/workspace/:ws/member/:id` and the API serves
      # `/members/`; every load 404'd, so the Backlog was permanently empty and
      # the Time-blocking switches gated nothing. Both stubbed planner suites
      # matched the CLIENT's spelling, so neither could ever see it. The first
      # check here watches the request the page really makes and fails on a 404.
      - name: Planner rail
        if: '!cancelled()'
        run: node test/e2e/planner-rail.mjs --api 3011 --dist apps/web/dist
        env:
          E2E_EMAIL: admin@rundesk.internal
          E2E_PASSWORD: Admin@123!

      # §V2-S15, frame `15:25` — Favorite and Archive in the task menu.
      #
      # Favorite existed as a star; the menu is where the frame reaches for it,
      # and both controls read one hook so they cannot drift. Archive existed
