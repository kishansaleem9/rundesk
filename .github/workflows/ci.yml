name: CI

on:
  # NO `paths-ignore` HERE, and that is deliberate — it was tried and reverted.
  #
  # 5cf2474 added `paths-ignore: ['docs/**']` to skip runs for prose-only
  # commits. It cannot work on a `pull_request` trigger: GitHub evaluates path
  # filters for that event against the WHOLE PR DIFF (head vs base), not
  # against the commits in the latest push, and a run is skipped only when
  # EVERY changed file matches. This PR touches hundreds of files under
  # `apps/`, `packages/` and `test/`, so `docs/**` never matched and the very
  # next docs-only push spent a full run proving it.
  #
  # THE SAVING IS TAKEN AT THE JOB LEVEL INSTEAD — see the `changes` job. That
  # comment used to end here saying the fix "changes CI semantics for every
  # contributor" and that batching pushes was the answer for now. It was not:
  # three more docs-only pushes went out after it was written, at a full run
  # each. Documenting a leak is not closing one.
  pull_request:
  push:
    branches:
      - main
  # Re-run CI without inventing a commit to hang it off. A run that was
  # cancelled out of the queue, or a flake, should not need an empty commit in
  # the history to get another attempt.
  workflow_dispatch:

# One run per branch at a time.
#
# Pushing three times in ten minutes queued three full runs of everything, and
# the two older ones were building commits nobody was waiting on any more —
# then sat in the queue holding it up, and were eventually cancelled anyway. The
# newest commit is the one worth the runners.
#
# `main` is exempt: a run there is a record of whether that commit was good, and
# a later push must not erase the answer for an earlier one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Did this PUSH touch anything but prose?
  #
  # WHY A JOB RATHER THAN `paths-ignore`. Path filters on `pull_request` are
  # evaluated against the whole PR diff, which for this PR is hundreds of files,
  # so they never match. But the `synchronize` payload DOES carry `before` and
  # `after` for the push that triggered it — the incremental range, which is
  # exactly the question worth asking. So the diff is computed here and the two
  # expensive jobs are gated on the answer.
  #
  # IT FAILS OPEN, EVERY TIME. Anything unexpected — a force-push where `before`
  # is no longer an ancestor, a first push, a shallow fetch that lacks the
  # commit, an empty diff — runs the full suite. The cost of wrongly running is
  # thirty minutes; the cost of wrongly skipping is shipping untested code, and
  # those are not the same size of mistake.
  #
  # `Verify Monorepo` is deliberately NOT gated. It is about four minutes of the
  # thirty-three, and leaving it always-on means a docs push still reports a
  # real check rather than an empty set that a branch protection rule might
  # read as nothing having run.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.decide.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The head of the branch, with history, so `before` is reachable.
          # Without this the checkout is a merge commit and the diff below
          # cannot resolve either end of the range.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -u
          code=true
          if [ "$EVENT" = "pull_request" ] && [ "$ACTION" = "synchronize" ] \
             && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null \
             && git cat-file -e "${AFTER}^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BEFORE" "$AFTER")
            echo "files in this push:"
            echo "$changed" | sed 's/^/  /'
            # Skip only when there IS a diff and NOTHING in it lies outside
            # docs. An empty diff means something unexpected, so it runs.
            if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qvE '^(docs/|[^/]*\.md$)'; then
              code=false
            fi
          fi
          echo "run expensive jobs: $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify Monorepo
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.1

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: API tests
        run: pnpm --filter @rundesk/api test

      # Pure logic lifted out of components so it can be checked without a DOM
      # — e.g. which notification types Clear all is allowed to bin.
      - name: Web unit tests
        run: pnpm --filter @rundesk/web test

      - name: Migration sequence guardrail
        run: node scripts/check-migration-order.mjs

      # Step 6 of the re-audit applies deliberately-broken edits to the tree to
      # prove a check can fail. On a shared tree, a `git add -A` eventually
      # catches one — and one reached `43f7b57`, hiding the Add-fields button
      # behind a testid renamed `-DISABLED`. Nothing failed; the diff read as a
      # decision somebody had taken. Vigilance is not a control, so this is.
      - name: No break patches in the tree
        run: node scripts/check-no-break-patches.mjs

      # The re-audit ledger's headline count read `88 built · 21 partial · 64
      # missing` while the table under it — printed under the words "so the
      # number can be checked rather than believed" — read 104 / 20 / 49. BOTH
      # SUMMED TO 173, so the disagreement was invisible at a glance and
      # survived several passes. A count is the one thing in that file that
      # gets quoted without being checked, so it is checked here instead.
      - name: The re-audit ledger agrees with its own derivation
        run: node scripts/check-video2-counts.mjs

      # Two generations of hashed chunks must survive a publish, or a tab open
      # across a deploy 404s on every lazy import.
      - name: Web publish keeps the previous release's chunks
        run: bash test/deploy/publish-web-dist.test.sh

      # A timed-out locator in one section of the deployed-UI check used to end
      # the whole run while the summary still read like a near-complete pass.
      # Needs no browser: it drives verify-ui.mjs against a stub.
      - name: Deployed-UI check survives a section that throws
        run: bash test/deploy/verify-ui-isolation.test.sh

  # The checks that need a real database.
  #
  # Every defect these have caught was invisible to the unit suites by
  # construction: a drizzle query that renders differently than it reads, a
  # conditional write whose condition only exists in SQL, a constraint the
  # fresh-install path never created. A fake database cannot fail any of them —
  # it is the thing deciding the answer.
  #
  # The schema is built by `drizzle-kit push` from the TypeScript source, which
  # is exactly how a new deployment is built, so a constraint that lives only in
  # a migration is missing here too rather than silently present.
  postgres-harnesses:
    name: Postgres harnesses
    runs-on: ubuntu-latest
    # The long job. Skipped when the push was prose only.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # THIS NUMBER GOES STALE EVERY TIME A SUITE IS ADDED, AND IT HAS TWICE.
    #
    # First it said "it now runs twenty-one" at 32 minutes, measured off the run
    # at 2cd5d0a: seventeen suites in 18m30s, so roughly 1.1 minutes each — by
    # then the job ran FIFTY, about 55 minutes, and 32 was not a backstop any
    # more but a guaranteed failure a few suites from the end, after paying for
    # all of it. It was raised to 75 for those fifty.
    #
    # The job now runs ONE HUNDRED AND SEVEN — every suite in the repo, with
    # none unregistered. At the measured 1.1 minutes each that is about 118
    # minutes plus setup. The count has gone
    # 50 → 85 → 88 → 93 → 96 → 98 → 101 → 104 → 107 in two days.
    #
    # The limit is 180 rather than 150, and that is a stopgap, not the fix.
    # Raising it costs nothing — GitHub bills the runtime, not the limit, and
    # the limit only decides whether a slow run finishes or is killed with the
    # answer half-written. At 118 estimated against 150 the margin was about
    # twenty percent, which is thinner than the variance between a warm runner
    # and a cold one.
    #
    # **THE FIX IS TO SPLIT THIS JOB**, and it is deliberately not being done
    # here. Splitting means duplicating the Postgres + Meilisearch + build
    # setup into a second job and dividing 107 steps between them, and CI
    # cannot run until October, so it could not be validated — a restructure
    # that is wrong is worse on the first green day than a job that is merely
    # long. Whoever has a working pipeline should do it, and will be able to
    # see it work.
    #
    # Splitting shortens the WALL CLOCK and not the bill: the minutes are the
    # same either way, plus one more setup.
    #
    # IF YOU ADD A SUITE, RE-DO THIS ARITHMETIC. `grep -c "node test/e2e/"` over
    # this job gives the count; multiply by 1.1 and add a few minutes of setup.
    # A limit that is merely old reads as a flaky pipeline, and a flaky pipeline
    # is one nobody looks at.
    #
    # 120 costs nothing when the job finishes sooner: GitHub bills the runtime,
    # not the limit. The limit only decides whether a slow run is allowed to
    # finish or is killed with the answer half-written.
    #
    # Splitting across parallel jobs shortens the WALL CLOCK and not the bill —
    # the minutes are the same either way, plus a second setup — so it is worth
    # doing when somebody is waiting on the result, not to save the budget.
    timeout-minutes: 180

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rundesk
          POSTGRES_PASSWORD: rundesk
          POSTGRES_DB: rundesk_calls
        ports:
          - 5432:5432
        # `-U rundesk` is not a detail. Bare `pg_isready` connects as the
        # container's OS user, which is root, and root is not a Postgres role —
        # so every five seconds for the whole twenty-odd minutes this job runs,
        # the service container logs `FATAL: role "root" does not exist`. The
        # healthcheck still passes (the server answered, which is all it asks),
        # so nothing looked wrong; what it cost was the LOG. Roughly 280 lines
        # of that noise are appended after the test output, and the API only
        # serves log tails — so a failing suite's own message sat behind more
        # noise than could be paged back through, and a real failure could not
        # be diagnosed without spending another run.
        options: >-
          --health-cmd "pg_isready -U rundesk -d rundesk_calls"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://rundesk:rundesk@localhost:5432/rundesk_calls
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.1

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create the schema from the TypeScript source
        run: pnpm --filter @rundesk/db exec drizzle-kit push --force

      - name: Load the fixtures
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/test/calls-http-fixtures.sql

      # The harnesses import the compiled service, guards and controllers, so
      # what runs here is what ships rather than a re-compilation of it.
      - name: Build the API
        run: pnpm --filter @rundesk/api build

      # §2.8 SyncUp: the call routes, the consent condition that rides with the
      # transcript write, the one-live-call index, and the record a call leaves.
      - name: Calls, against real Postgres
        working-directory: apps/api
        run: npx tsx test/calls-http.mts

      # §2.2/§2.8 gap 11: "Contact your admin" — who was actually reached, and
      # the once-a-day rule that has been silently wrong in both directions.
      - name: The feature gate, against real Postgres
        if: '!cancelled()'
        working-directory: apps/api
        run: npx tsx test/feature-gate-http.mts

      # §2.8 — the call itself, between two real browsers.
      #
      # Everything above stops at the API. The peer-to-peer path had never been
      # executed by anything until this suite, and the first thing it found was
      # a deadlock that left roughly two calls in five connecting forever, with
      # both ends reporting themselves healthy. Nothing cheaper than two
      # browsers can see that.
      - name: Install Chromium
        if: '!cancelled()'
        run: pnpm exec playwright install --with-deps chromium

      - name: Seed a workspace
        if: '!cancelled()'
        run: pnpm --filter @rundesk/db exec tsx src/seed.ts

      - name: Build the SPA
        if: '!cancelled()'
        run: pnpm --filter @rundesk/web exec vite build

      # Backgrounded and waited for: a suite that starts talking to an API that
      # is not up yet fails for a reason that has nothing to do with calls.
      - name: Start the API
        if: '!cancelled()'
        # From apps/api, like every other step here: tsx is a dependency of that
        # package, so `npx tsx` from the repo root is "tsx: not found" — which
        # presents as an API that never comes up rather than as a missing tool.
        working-directory: apps/api
        run: |
          # nohup + disown so it outlives this step's shell — the runner tears
          # processes down at the end of the JOB, not the end of a step.
          nohup npx tsx dist/apps/api/src/main.js > /tmp/api.log 2>&1 &
          disown
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null "http://127.0.0.1:$PORT/api/v1/auth/oauth/providers"; then
              echo "API up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "API never came up. Its output:"; cat /tmp/api.log; exit 1
        env:
          PORT: 3011

      - name: A real SyncUp, in two browsers
        if: '!cancelled()'
        run: node test/e2e/syncup-live.mjs --api 3011 --dist apps/web/dist

      # The suites written for the video1 gap work. They live here rather than
      # in browser-suites because each one drives the real API against real
      # Postgres — a stubbed run would decide its own answers, and every one of
      # these gaps was a case where the parts existed and nothing joined them
      # up, which is exactly what a stub cannot see.
      #
      # `!cancelled()` on each, so one failure reports its own name instead of
      # hiding the four behind it.
      - name: Chat message actions
        if: '!cancelled()'
        run: node test/e2e/chat-message-actions.mjs --api 3011 --dist apps/web/dist

      - name: Task creation depth
        if: '!cancelled()'
        run: node test/e2e/task-depth.mjs --api 3011 --dist apps/web/dist

      - name: The second-level panel collapses
        if: '!cancelled()'
        run: node test/e2e/panel-collapse.mjs --api 3011 --dist apps/web/dist

      - name: Status, timed mute, contrast, booking a call
        if: '!cancelled()'
        run: node test/e2e/settings-depth.mjs --api 3011 --dist apps/web/dist

      - name: The person profile panel
        if: '!cancelled()'
        run: node test/e2e/person-panel.mjs --api 3011 --dist apps/web/dist

      # Every addressability fix driven in one session against a real API, a
      # real Postgres and a real Meilisearch — the thing the per-fix suites
      # cannot catch is one of them breaking another.
      - name: Addressability, end to end
        if: '!cancelled()'
        run: node test/e2e/addressability-live.mjs --api 3011 --dist apps/web/dist

      # The four suites that used to be unrunnable anywhere but one laptop.
      #
      # Each hardcoded some combination of a dev server on :5173, one
      # workspace's UUID, and a colleague called "Colleague" — so pointed at a
      # freshly seeded database they swept an empty shell and failed for
      # reasons that had nothing to do with the UI. They now serve the built
      # dist themselves, discover a workspace, and create the little they need
      # (tasks across statuses and priorities, a DM, a shared task and
      # meeting) before reading it back.
      #
      # Being out of CI is why three of them had gone stale against shipped
      # decisions: two asserted an Inbox "Other" chip §2.2 removed, one wanted
      # "Mark all read" where §2.5 put "Clear all", and one looked for the
      # language switcher in the top bar §1.5 cleared.
      #
      # E2E_EMAIL is set because their defaults name the production verify
      # user, which no seeded database has. admin + org-admin are both seeded,
      # and the pair matters: some checks need somebody else to act on you.
      - name: UI sweep — every surface, in a browser
        if: '!cancelled()'
        run: node test/e2e/ui-sweep.mjs --api 3011 --dist apps/web/dist

      - name: The video1 regression sweep
        if: '!cancelled()'
        run: node test/e2e/video-regression.mjs --api 3011 --dist apps/web/dist
        env:
          E2E_EMAIL: admin@rundesk.internal
          E2E_PASSWORD: Admin@123!

      # §G10 — asking for access to something you cannot see. Creates its own
      # plain member, because every seeded account is a workspace_admin and a
      # manager can see private items by design: run as one of those and the
      # 403 under test never happens.
      - name: Requesting access to a private object
        if: '!cancelled()'
        run: node test/e2e/request-access.mjs --api 3011 --dist apps/web/dist
        env:
          E2E_EMAIL: admin@rundesk.internal
          E2E_PASSWORD: Admin@123!

      # §G15-10 — a List that lives directly in a Space. Makes its own space:
      # reusing an existing one means the hidden container is already there
      # from an earlier run, so the creation path — the thing under test —
      # never runs, and a broken container passes cleanly.
      - name: A List under a Space
        if: '!cancelled()'
        run: node test/e2e/list-under-space.mjs --api 3011 --dist apps/web/dist
        env:
          E2E_EMAIL: admin@rundesk.internal
          E2E_PASSWORD: Admin@123!

      # §G12-2 — answering a thread from the Replies list without opening the
      # channel. Needs two accounts: a notification only reaches somebody who
      # did not write the message.
      - name: Replies answers a thread in place
        if: '!cancelled()'
        run: node test/e2e/replies-inline-thread.mjs --api 3011 --dist apps/web/dist
        env:
          E2E_EMAIL: admin@rundesk.internal
          E2E_PASSWORD: Admin@123!
          E2E_PEER_EMAIL: org-admin@rundesk.internal
          E2E_PEER_PASSWORD: OrgAdmin@123!

      # §G10-6 / §G10-7 — two fan-outs that told nobody. API-level: these are
      # rows arriving in somebody else's inbox, not pixels, and driving a
      # browser to observe them would test the inbox rather than the fan-out.
      - name: Notifications that were never sent
        if: '!cancelled()'
        run: node test/e2e/notification-gaps.mjs --api 3011
        env:
          E2E_EMAIL: admin@rundesk.internal
          E2E_PASSWORD: Admin@123!
          E2E_PEER_EMAIL: org-admin@rundesk.internal
          E2E_PEER_PASSWORD: OrgAdmin@123!

      # §G14-8 — a minimised call survives navigating away. Needs fake capture
      # devices, and needs the navigation to be a CLICK: a full page load tears
      # down the app and cannot carry a MediaStream, so it would fail forever
      # and say nothing about the defect.
      - name: A SyncUp survives leaving the page
        if: '!cancelled()'
        run: node test/e2e/call-survives-navigation.mjs --api 3011 --dist apps/web/dist
        env:
          E2E_EMAIL: admin@rundesk.internal
          E2E_PASSWORD: Admin@123!

      # §G01-9 — the Overview's Bookmarks card. Needs two accounts: what the
      # owner-scoping protects against is a colleague who knows an id, not an
      # anonymous caller, and only a second signed-in user can show that.
      - name: Bookmarks, internal and external
        if: '!cancelled()'
        run: node test/e2e/bookmarks.mjs --api 3011 --dist apps/web/dist
        env:
          E2E_EMAIL: admin@rundesk.internal
          E2E_PASSWORD: Admin@123!
          E2E_PEER_EMAIL: org-admin@rundesk.internal
          E2E_PEER_PASSWORD: OrgAdmin@123!

      # §G03-6 — Trending In Workspace / Trending For You. Two accounts again:
      # the two modes are only distinguishable when somebody else opens things.
      - name: Trending sorts
        if: '!cancelled()'
        run: node test/e2e/trending-sort.mjs --api 3011
        env:
          E2E_EMAIL: admin@rundesk.internal
          E2E_PASSWORD: Admin@123!
          E2E_PEER_EMAIL: org-admin@rundesk.internal
          E2E_PEER_PASSWORD: OrgAdmin@123!

      # An id that cannot be a UUID must be refused on the way in rather than by
      # Postgres. Both halves of that were live, and neither failed a check —
      # the only symptom was `invalid input syntax for type uuid` in this job's
      # own service-container log, which nothing was reading.
      - name: Malformed ids
        if: '!cancelled()'
        run: node test/e2e/malformed-ids.mjs --api 3011
        env:
          E2E_EMAIL: admin@rundesk.internal
          E2E_PASSWORD: Admin@123!

      # §V2-04 — a form submission becomes a task that says a form made it.
      # The meeting half of the same change cannot run here (it needs a model),
      # so it is covered by a unit test with the AI stubbed instead.
      # §V2-01b `[00:24]`, frame `00:25` — "Progress (Auto)", the one custom
      # field she demonstrates end to end.
      #
      # The value is DERIVED, so the checks that earn their minutes are the ones
      # about not lying: that nothing is stored for it, that writing it is
      # refused, that an ordinary comment is not counted as work, and that a
      # task with nothing to count reports null rather than a confident 0%.
      #
      # It stages its own space, project and list — custom fields are defined
      # per project, so a field on the seeded project would change the shape of
      # every other suite's task rows.
      - name: Progress (Auto) custom field
        if: '!cancelled()'
        run: node test/e2e/custom-field-progress.mjs --api 3011 --dist apps/web/dist
        env:
          E2E_EMAIL: admin@rundesk.internal
          E2E_PASSWORD: Admin@123!

      # §V2-13, frame `09:10` — "List moved to trash" + Undo (Ctrl+Z).
      #
      # Deleting from the tree used to succeed in SILENCE, with the only way
      # back being knowledge that Trash is a settings tab. The checks that earn
      # the minutes are the two that cannot be faked: that the delete is SOFT
      # (an undo over a hard delete would be a button that apologises), and
      # that pressing Undo puts the list back according to the API rather than
      # the screen. A suite asserting "a toast appeared" would pass against a
      # button wired to nothing.
      - name: Undo a delete
        if: '!cancelled()'
        run: node test/e2e/undo-delete.mjs --api 3011 --dist apps/web/dist
        env:
          E2E_EMAIL: admin@rundesk.internal
          E2E_PASSWORD: Admin@123!

      - name: Task provenance
        if: '!cancelled()'
        run: node test/e2e/task-provenance.mjs --api 3011
        env:
          E2E_EMAIL: admin@rundesk.internal
          E2E_PASSWORD: Admin@123!

      # §V2-09 — the task cover. The load-bearing check is that a LINKED image
      # comes back byte for byte: task attachments store a hyperlink in
      # `storage_key` and read it back through R2, and this is the shape that
      # does not repeat it.
      - name: Task cover
        if: '!cancelled()'
        run: node test/e2e/task-cover.mjs --api 3011 --dist apps/web/dist
        env:
          E2E_EMAIL: admin@rundesk.internal
          E2E_PASSWORD: Admin@123!

      # §V2-08 — merging one task into another. She never narrates it, so it
      # ranked last in the item; it is also the only one whose failure mode is
      # silent data loss, so the suite loads a task with one of everything and
      # counts each kind on the survivor afterwards. Both tasks are given the
      # SAME assignee and watcher first, because duplicates being merged
      # normally share them and every join table is unique on (task, thing) —
      # a bulk UPDATE throws on the first collision.
      - name: Merging one task into another
        if: '!cancelled()'
        run: node test/e2e/task-merge.mjs --api 3011 --dist apps/web/dist
        env:
          E2E_EMAIL: admin@rundesk.internal
          E2E_PASSWORD: Admin@123!

      # §V2-12, frame `20:55` — the Teams destination.
      #
      # It is driven as a REGISTERED PLAIN MEMBER, and that is the whole point:
      # All People, All Teams and the reporting tree already existed inside
      # workspace settings, whose route redirects any non-admin back to /app, so
      # looking at your own organisation required admin rights. Run as the
      # seeded admin every check here would pass against the old code too.
      #
      # It also fails if an Analytics tab appears. The frame lists one, nothing
      # exists behind it, and she never opens it — so it would be a page whose
      # purpose somebody has to guess.
      - name: The Teams destination
        if: '!cancelled()'
        run: node test/e2e/teams-destination.mjs --api 3011 --dist apps/web/dist
        env:
          E2E_EMAIL: admin@rundesk.internal
          E2E_PASSWORD: Admin@123!

