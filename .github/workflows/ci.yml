name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    name: Verify Monorepo
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.1

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: API tests
        run: pnpm --filter @rundesk/api test

      # Pure logic lifted out of components so it can be checked without a DOM
      # — e.g. which notification types Clear all is allowed to bin.
      - name: Web unit tests
        run: pnpm --filter @rundesk/web test

      - name: Migration sequence guardrail
        run: node scripts/check-migration-order.mjs

      # Two generations of hashed chunks must survive a publish, or a tab open
      # across a deploy 404s on every lazy import.
      - name: Web publish keeps the previous release's chunks
        run: bash test/deploy/publish-web-dist.test.sh

      # A timed-out locator in one section of the deployed-UI check used to end
      # the whole run while the summary still read like a near-complete pass.
      # Needs no browser: it drives verify-ui.mjs against a stub.
      - name: Deployed-UI check survives a section that throws
        run: bash test/deploy/verify-ui-isolation.test.sh

  browser-suites:
    name: Browser suites
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.1

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Builds two releases and drives a browser across the deploy between
      # them. Guards the crash from the 7 Aug review video: a tab open across a
      # deploy asking for chunks the server has already deleted.
      - name: Stale-chunk recovery
        run: node test/e2e/stale-chunk-recovery.mjs

      # Holds each response the app waits on and looks at the screen while it
      # is outstanding. None of these are visible unless something is slow.
      #
      # `!cancelled()` on this and the next one so a failure in an earlier suite
      # does not HIDE the later ones. It did: one broken assertion in the
      # loading-states suite skipped the 90-check video1 suite for six
      # consecutive commits, and the run reported "failure" either way — so
      # there was no way to tell from CI whether those 90 checks still passed.
      # A skipped suite is not a passing suite, and it should not look like one.
      - name: Loading states are never blank
        if: '!cancelled()'
        run: node test/e2e/loading-states.mjs

      - name: video1 fast items
        if: '!cancelled()'
        run: node test/e2e/video1-fast-items.mjs

      # §2.8 gap 7. The emoji list is a separate 34 kB chunk fetched by a
      # dynamic import the first time the picker opens. If that chunk goes
      # missing from a build, every unit test still passes — the module
      # resolves fine from source — and the picker shows its skeleton forever.
      # Deleting the chunk from the served dist fails eight checks here.
      - name: The emoji picker loads its list
        if: '!cancelled()'
        run: node test/e2e/emoji-picker.mjs
