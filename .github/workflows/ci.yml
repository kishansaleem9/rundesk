      # check counts matches across `/lists/space/:id` and the per-project
      # walk and still demands exactly one, so nothing-created, wrong-space and
      # created-twice all redden it.
      - name: The create menu's AI row writes what it reports
        if: '!cancelled()'
        run: node test/e2e/create-menu-ai.mjs --api 3011 --dist apps/web/dist
        env:
          E2E_EMAIL: admin@rundesk.internal
          E2E_PASSWORD: Admin@123!
          DATABASE_URL: postgres://rundesk:rundesk@127.0.0.1:5432/rundesk_ci

      # §V2 — "⚡ Assign with AI". `assign_task` existed; choosing the person
      # did not. The ranking is the feature, so the suite adds work to the
      # first pick and requires the suggestion to name somebody ELSE — with no
      # escape hatch, since the subject's list is the run's own and every
      # candidate starts at `inList = 0`, so only load moved. It recommends and
      # does not assign, which is asserted by re-reading the task.
      - name: Assign with AI ranks by real load, and does not assign
        if: '!cancelled()'
        run: node test/e2e/ai-assign.mjs --api 3011 --dist apps/web/dist
        env:
          E2E_EMAIL: admin@rundesk.internal
          E2E_PASSWORD: Admin@123!
          DATABASE_URL: postgres://rundesk:rundesk@127.0.0.1:5432/rundesk_ci

      # §V2-15 `12:40`/`12:45` — the planner's onboarding panel and its
      # carousel. The Connect check asserts the browser LANDS on the URL the
      # server handed it, not merely that it asked: `window.location.href =
      # authUrl` is the convention in all three OAuth surfaces, so "it
      # requested" and "it went there" are different facts and only the second
      # is the feature. The geometry check scrolls the grid home first — a day
      # column is 24h tall inside a container the planner scrolls to the
      # current hour, so comparing raw bounding boxes was measuring the clock
      # and could only have held between midnight and 01:00.
      - name: The planner onboarding panel and its carousel
        if: '!cancelled()'
        run: node test/e2e/planner-onboarding.mjs --api 3011 --dist apps/web/dist
        env:
          E2E_EMAIL: admin@rundesk.internal
          E2E_PASSWORD: Admin@123!
          DATABASE_URL: postgres://rundesk:rundesk@127.0.0.1:5432/rundesk_ci

      # §V2-15 — the planner's bottom command bar, which must open the SHARED
      # palette rather than grow a second search surface beside it. ⌘K has to
      # open exactly ONE: the shell keeps the hotkey because the palette is
      # only mounted while open, and the component registers a toggling ⌘K of
      # its own, so a stowaway second copy is invisible until a keypress —
      # a break patch that mounted one permanently left the earlier version of
      # this check green.
      - name: The planner command bar opens the shared palette
        if: '!cancelled()'
        run: node test/e2e/planner-command-bar.mjs --api 3011 --dist apps/web/dist
        env:
          E2E_EMAIL: admin@rundesk.internal
          E2E_PASSWORD: Admin@123!
          DATABASE_URL: postgres://rundesk:rundesk@127.0.0.1:5432/rundesk_ci

  browser-suites:
    name: Browser suites
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.1

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Builds two releases and drives a browser across the deploy between
      # them. Guards the crash from the 7 Aug review video: a tab open across a
      # deploy asking for chunks the server has already deleted.
      - name: Stale-chunk recovery
        run: node test/e2e/stale-chunk-recovery.mjs

      # Holds each response the app waits on and looks at the screen while it
      # is outstanding. None of these are visible unless something is slow.
      #
      # `!cancelled()` on this and the next one so a failure in an earlier suite
      # does not HIDE the later ones. It did: one broken assertion in the
      # loading-states suite skipped the 90-check video1 suite for six
      # consecutive commits, and the run reported "failure" either way — so
      # there was no way to tell from CI whether those 90 checks still passed.
      # A skipped suite is not a passing suite, and it should not look like one.
      - name: Loading states are never blank
        if: '!cancelled()'
        run: node test/e2e/loading-states.mjs

      - name: video1 fast items
        if: '!cancelled()'
        run: node test/e2e/video1-fast-items.mjs

      # §2.8 gap 7. The emoji list is a separate 34 kB chunk fetched by a
      # dynamic import the first time the picker opens. If that chunk goes
      # missing from a build, every unit test still passes — the module
      # resolves fine from source — and the picker shows its skeleton forever.
      # Deleting the chunk from the served dist fails eight checks here.
      - name: The emoji picker loads its list
        if: '!cancelled()'
        run: node test/e2e/emoji-picker.mjs

      # Every hit the stub returns matches only in its BODY. The palette used
      # to re-filter server results with cmdk's fuzzy matcher, which scores the
      # title alone — so it hid results it was already holding, and chat
      # messages (titled "Chat message" by the server) could never appear.
      - name: The command palette shows what the server found
        if: '!cancelled()'
        run: node test/e2e/command-palette.mjs

      # /app/profile and /app/help sit outside the workspace tree, so the
      # sidebar's nav — which is built from a workspace id — rendered nothing
      # and neither page has a back link. The Inbox settings gear links
      # straight into that.
      - name: No page is a dead end
        if: '!cancelled()'
        run: node test/e2e/no-dead-ends.mjs
