      #
      # `formula` is the one worth knowing about. It was the obvious candidate
      # for "build the shell, leave the compute unrouted", and a formula over a
      # task's own numeric fields turns out to be arithmetic — so it is
      # evaluated for real, derived on read like `progress_auto` and refusing
