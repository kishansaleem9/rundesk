<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080d1f" />
    <title>Rundesk — modern work, run on Aura</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Loaded without blocking first paint. As a plain stylesheet this is a
      third-party request standing between the user and *any* pixels: if
      fonts.googleapis.com is slow, the whole page waits on it. `media="print"`
      makes it non-render-blocking, and the onload flip applies it the moment it
      arrives. The faces already ship `display=swap`, so text is readable in the
      fallback stack until then rather than invisible.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <!--
      The app's own stylesheet arrives with the JS bundle, so everything between
      first paint and React mounting has to be inline. Two things happen here.

      First, the theme is resolved before paint. index.html ships class="dark",
      so a light-theme user used to get a dark flash on every load; the store
      only corrects it once the bundle has parsed.

      Second, the wait itself is drawn. Until React mounts, #root is empty — on
      a slow connection that is seconds of blank screen, which is the first
      thing called out in the 7 Aug review: "waiting ka jo time period hai woh
      BLANK SCREEN na ho — woh icons hi hon." So we paint the shell the app is
      about to render: the icon rail, the top bar, and a few content blocks.
      main.tsx removes it once the real UI is up.
    -->
    <script>
      ;(function () {
        try {
          var stored = JSON.parse(localStorage.getItem('rundesk.theme') || '{}')
          var theme = (stored.state && stored.state.theme) || 'system'
          var dark =
            theme === 'dark' ||
            (theme === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.remove('light', 'dark')
          document.documentElement.classList.add(dark ? 'dark' : 'light')
        } catch (e) {
          /* first visit, or storage blocked — the shipped dark class stands */
        }
        try {
          // §1.3 — the sidebar can be collapsed to an icon rail, and that is a
          // persisted preference. Draw the skeleton at the width this session
          // actually uses, so the real sidebar does not jump into place.
          var sidebar = JSON.parse(localStorage.getItem('rundesk.sidebar') || '{}')
          if (sidebar.state && sidebar.state.collapsed) {
            document.documentElement.setAttribute('data-boot-rail', 'collapsed')
          }
        } catch (e) {
          /* expanded is the default */
        }
      })()
    </script>
    <style>
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        background: #f8fafc;
        --boot-line: #e2e8f0;
        --boot-block: #eef2f7;
        --boot-edge: #e2e8f0;
      }
      html.dark #boot {
        background: #080d1f;
        --boot-line: #1b2547;
        --boot-block: #131c3a;
        --boot-edge: #1b2547;
      }
      /* Matches the real sidebar: 288px expanded, 56px collapsed. */
      #boot .rail {
        width: 288px;
        border-right: 1px solid var(--boot-edge);
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        flex: none;
      }
      #boot .rail i {
        height: 26px;
      }
      #boot .rail i:first-child {
        height: 48px;
      }
      html[data-boot-rail='collapsed'] #boot .rail {
        width: 56px;
        padding: 14px 0;
        align-items: center;
      }
      html[data-boot-rail='collapsed'] #boot .rail i,
      html[data-boot-rail='collapsed'] #boot .rail i:first-child {
        width: 28px;
        height: 28px;
        border-radius: 9px;
      }
      #boot .body {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      #boot .bar {
        height: 56px;
        border-bottom: 1px solid var(--boot-edge);
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 18px;
      }
      #boot .main {
        padding: 24px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      #boot i {
        display: block;
        background: var(--boot-block);
        border-radius: 8px;
        position: relative;
        overflow: hidden;
      }
      #boot i.dot {
        width: 28px;
        height: 28px;
        border-radius: 9px;
      }
      #boot i::after {
        content: '';
        position: absolute;
        inset: 0;
        transform: translateX(-100%);
        background: linear-gradient(
          90deg,
          transparent,
          var(--boot-line),
          transparent
        );
        animation: boot-shimmer 1.6s linear infinite;
      }
      @keyframes boot-shimmer {
        to {
          transform: translateX(100%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot i::after {
          animation: none;
        }
      }
    </style>
    <div id="boot" role="status" aria-live="polite">
      <!--
        The shapes are decoration, but the wait is not: on a deep link this is
        on screen until the route's chunk lands, and a screen reader would
        otherwise be told nothing at all for the whole of it. Styles are inline
        because the app's sr-only class arrives with the bundle we are waiting
        for.
      -->
      <span
        style="
          position: absolute;
          width: 1px;
          height: 1px;
          overflow: hidden;
          clip: rect(0 0 0 0);
          white-space: nowrap;
        "
        >Loading Rundesk…</span
      >
      <div class="rail" aria-hidden="true">
        <i></i><i></i><i></i><i></i><i></i><i></i>
      </div>
      <div class="body" aria-hidden="true">
        <div class="bar">
          <i style="width: 180px; height: 20px"></i>
          <i style="width: 288px; height: 28px; margin-left: auto"></i>
          <i class="dot"></i>
        </div>
        <div class="main">
          <i style="width: 240px; height: 26px"></i>
          <i style="height: 64px"></i>
          <i style="height: 64px"></i>
          <i style="height: 64px"></i>
          <i style="height: 64px; opacity: 0.6"></i>
          <i style="height: 64px; opacity: 0.3"></i>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
