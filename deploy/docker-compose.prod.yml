# Rundesk production stack — designed to coexist with the host's existing
# nginx (which proxies *.theaura.agency to per-app loopback ports).
#
# Container ports are bound to 127.0.0.1 so they are not publicly reachable;
# nginx on the host terminates TLS and proxies into rundesk-api.
services:
  postgres:
    image: postgres:16-alpine
    container_name: rundesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rundesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rundesk@aura}
      POSTGRES_DB: ${POSTGRES_DB:-rundesk}
    volumes:
      - rundesk_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-rundesk} -d ${POSTGRES_DB:-rundesk}']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - rundesk

  redis:
    image: redis:7-alpine
    container_name: rundesk-redis
    restart: unless-stopped
    volumes:
      - rundesk_redis:/data
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - rundesk

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: rundesk-meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY}
    volumes:
      - rundesk_meili:/meili_data
    networks:
      - rundesk

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: rundesk-api:latest
    container_name: rundesk-api
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-rundesk}:${POSTGRES_PASSWORD:-rundesk@aura}@postgres:5432/${POSTGRES_DB:-rundesk}
      REDIS_URL: redis://redis:6379
      MEILISEARCH_URL: http://meilisearch:7700
      PORT: 3001
      # ONE PROXY IN FRONT, nginx (`found-30-sep/client-address-behind-nginx`).
      # The socket the API sees is Docker's bridge gateway for every visitor, so
      # without this each per-address limit (sign-in's ten a minute, the public
      # routes' budgets) and the workspace IP allowlist saw one address for the
      # whole site. 1 trusts exactly the entry nginx appends to X-Forwarded-For,
      # never the ones before it, which the client writes. Raise it only for a
      # proxy that appends in front of nginx (a CDN: 2); `true` is read as 1.
      TRUST_PROXY: ${TRUST_PROXY:-1}
    # Bind only to loopback — nginx on the host proxies into this port.
    ports:
      - '127.0.0.1:${API_HOST_PORT:-3010}:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rundesk

volumes:
  rundesk_pg:
  rundesk_redis:
  rundesk_meili:

networks:
  rundesk:
    driver: bridge
