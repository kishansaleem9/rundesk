# Rundesk nginx vhost — install at /etc/nginx/sites-available/rundesk.theaura.agency.
# `./deploy/deploy.sh nginx` symlinks this file and runs certbot.

server {
    listen 80;
    server_name rundesk.theaura.agency;
    client_max_body_size 100M;

    root /opt/rundesk/apps/web/dist;
    index index.html;

    # Long-cache built assets (hashed filenames)
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The entry point and the service worker must never be reused from cache.
    # index.html is the manifest that names the hashed chunks above; a stale
    # copy points at files a later deploy has removed, so every lazy import
    # 404s and the app dies (see apps/web/src/lib/chunk-reload.ts). Without an
    # explicit header nginx sends only Last-Modified/ETag and browsers apply
    # heuristic freshness — reusing it for hours without asking.
    location ~ ^/(index\.html|sw\.js|registerSW\.js|push-sw\.js|manifest\.webmanifest|version\.json)$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }

    # API
    location /api/ {
        proxy_pass http://127.0.0.1:3010/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The API trusts exactly this one hop (TRUST_PROXY=1, docker-compose.prod.yml):
        # the address appended here is the client's, and whatever the client put
        # before it is never read. A proxy put in front of nginx must raise it.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.io transport (namespace /realtime is on top of socket.io)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3010/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # SPA — fall back to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
